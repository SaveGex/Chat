services:
  chatapi:
    image: ${DOCKER_REGISTRY-}chatapi
    build:
      context: .
      dockerfile: Chat/Dockerfile
    container_name: chatapi
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      #ASPNETCORE_HOSTINGSTARTUPASSEMBLIES: "Microsoft.Azure.SignalR"
      ConnectionStrings__DefaultConnection: Server=mssql,1433;Database=${MSSQL_DATABASE};User Id=${MSSQL_USER};Password=${MSSQL_USER_PASSWORD};TrustServerCertificate=True;

      ASPNETCORE_HTTP_PORT: ${ASPNETCORE_HTTP_PORT}
      ASPNETCORE_HTTPS_PORT: ${ASPNETCORE_HTTPS_PORT}
      SchoolChatSecretsUri: ${SchoolChatSecretsUri}

      AzureAd__AZURE_TENANT_ID: ${AZURE_TENANT_ID}
      AzureAd__AZURE_CLIENT_ID: ${AZURE_CLIENT_ID}
      AzureAd__AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET}

      Jwt__SecretKey: ${Jwt__SecretKey}
      Jwt__Issuer: ${Jwt__Issuer}
      Jwt__Audience: ${Jwt__Audience}
      Jwt__AccessTokenExpirationInSeconds: ${Jwt__AccessTokenExpirationInSeconds} # 15 minutes
      Jwt__RefreshTokenExpirationInSeconds: ${Jwt__RefreshTokenExpirationInSeconds} # 12 days
    ports:
      - 8080:${ASPNETCORE_HTTP_PORT}
      - 8081:${ASPNETCORE_HTTPS_PORT}
    env_file:
      - .env
    networks:
      - schoolchat-network
  mssql:
    build:
      context: ./SqlServer/
      dockerfile: Dockerfile
    container_name: mssql
    hostname: mssql
    environment:
      MSSQL_DATABASE: ${MSSQL_DATABASE}
      MSSQL_USER: ${MSSQL_USER}
      MSSQL_USER_PASSWORD: ${MSSQL_USER_PASSWORD}

      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: "Developer"
    networks:
        - schoolchat-network
    healthcheck:
      test: ["CMD", "/scripts/healthcheck.sh"]
      start_period: 10s
      interval: 5s
      timeout: 10s
      retries: 15

networks:
  schoolchat-network:
    driver: 
      bridge


